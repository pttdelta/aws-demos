name: Hello World Workflow

on:
  workflow_call:  # Enables it to be called from another workflow
    inputs:
      tf_directory:
        required: true
        type: string
        default: "terraform.d/s3.d"
env:
  TERRAFORM_VERSION: "1.11.3"

jobs:
  terraform-lint-etc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.tf_directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2  ## latest tag at time of writing

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2  ## latest tag at time of writing
        with:
          terraform_version: "1.11.3"  # same version as defined in the terraform.tf and this isnt nice to share a variable to both places

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Test
        run: terraform test

      - name: Tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --config=${{ github.workspace }}/config.d/.tflint.hcl

      - name: Tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          tfsec --config=${{ github.workspace }}/config.d/.tfsec.hcl
