name: Hello World Workflow

on: [push]

env:
  TERRAFORM_VERSION: "1.11.3"

jobs:
  terraform-lint-etc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform.d/s3.d

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2  ## latest tag at time of writing

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2  ## latest tag at time of writing
        with:
          terraform_version: "1.11.3"  # same version as defined in the terraform.tf and this isnt nice to share a variable to both places

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Test
        run: terraform test

      - name: Tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint

      - name: Print greeting
        run: echo "Hello from GitHub Actions!"
